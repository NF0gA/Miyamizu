name: release

on:
  workflow_dispatch:          # 手動実行: ビルドのみ(Release は作らない)
  push:
    tags: ["v*"]              # v1.0.2 のようなタグ: テスト → ビルド → 下書き Release

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: タグとバージョンの一致、CHANGELOG の確認
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VER=$(python -c "import re;print(re.search(r'__version__\s*=\s*\"([^\"]+)\"',open('miyamizu/__init__.py').read()).group(1))")
          TAG="${GITHUB_REF_NAME#v}"
          echo "tag=$TAG version=$VER"
          [ "$TAG" = "$VER" ] || { echo "::error::タグ(v$TAG)と __version__($VER)が一致しません"; exit 1; }
          grep -q "^## $VER\b" CHANGELOG.md || { echo "::error::CHANGELOG.md に '## $VER' がありません"; exit 1; }
      - name: テスト
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: .
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libasound2-dev g++ libportaudio2 libegl1 libgl1 libxkbcommon0 libdbus-1-3 >/dev/null
          python -m pip install -q -r requirements.txt
          python tests/test_playorder.py
          python tests/test_tcp_ipc.py
          python tests/test_wasapi_fake.py
          python tests/test_nshape.py
          python tests/test_r8brain.py

  linux:
    needs: check
    runs-on: ubuntu-22.04      # 古めの glibc でビルドして幅広い環境で動くようにする
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: 依存
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libasound2-dev g++ libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - name: ビルド (r8brain → build.sh)
        env:
          MIYAMIZU_VENV: .venv
        run: |
          bash build_r8brain.sh
          bash build.sh
      - name: zip にまとめる
        run: |
          mkdir -p out
          (cd dist && zip -qr ../out/Miyamizu-linux-x86_64.zip Miyamizu)
      - uses: actions/upload-artifact@v4
        with:
          name: Miyamizu-linux
          path: out/Miyamizu-linux-x86_64.zip

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: MinGW-w64 (r8brain / ノイズシェーピングの DLL 用)
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc
      - name: PATH に MinGW を追加
        shell: pwsh
        run: echo "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: ビルド (build.bat)
        shell: cmd
        env:
          PYTHON: python
        run: build.bat
      - name: zip にまとめる
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Compress-Archive -Path dist\Miyamizu -DestinationPath out\Miyamizu-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Miyamizu-windows
          path: out/Miyamizu-windows-x64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: SHA256 とリリースノート
        run: |
          VER="${GITHUB_REF_NAME#v}"
          (cd out && sha256sum *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt)
          awk -v v="$VER" '$0 ~ "^## "v"([[:space:]]|$)" {f=1; next} /^## /{f=0} f' CHANGELOG.md > notes.md
          { echo; echo "### 配布物"; echo "- Linux: Miyamizu-linux-x86_64.zip(展開して Miyamizu/Miyamizu を実行)"; echo "- Windows: Miyamizu-windows-x64.zip(実機での動作は未検証の部分があります)"; echo "- SHA256SUMS.txt: 検証用ハッシュ"; } >> notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Miyamizu ${{ github.ref_name }}
          body_path: notes.md
          files: |
            out/Miyamizu-linux-x86_64.zip
            out/Miyamizu-windows-x64.zip
            out/SHA256SUMS.txt
